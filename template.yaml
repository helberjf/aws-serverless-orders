AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: >
  Serverless order processing system built with AWS SAM.

Globals:
  Function:
    Timeout: 5
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON

  Api:
    TracingEnabled: true


Resources:

  # ==============================
  # DynamoDB
  # ==============================

  OrdersTable:
    Type: AWS::DynamoDB::Table

    Properties:

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S

      KeySchema:
        - AttributeName: orderId
          KeyType: HASH


  # ==============================
  # SQS
  # ==============================

  OrdersQueue:
    Type: AWS::SQS::Queue

    Properties:
      VisibilityTimeout: 30

  # ==============================
  # Create Order Lambda
  # ==============================

  CreateOrderFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: src/create-order/

      Handler: app.lambdaHandler

      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          ORDERS_QUEUE_URL: !Ref OrdersQueue

      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt OrdersQueue.QueueName

      Events:

        CreateOrderApi:

          Type: Api

          Properties:

            Path: /orders
            Method: post


    Metadata:

      BuildMethod: esbuild

      BuildProperties:

        Minify: true
        Target: es2020
        Sourcemap: true

        EntryPoints:
          - app.ts


Outputs:

  OrdersApi:

    Description: API Gateway endpoint for creating orders

    Value: !Sub >
      https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/orders


  OrdersTableName:

    Description: DynamoDB Orders table

    Value: !Ref OrdersTable


  CreateOrderFunctionArn:

    Description: Create Order Lambda ARN

    Value: !GetAtt CreateOrderFunction.Arn
  
  OrdersQueueUrl:

    Description: SQS Orders Queue URL

    Value: !Ref OrdersQueue


  OrdersQueueArn:

    Description: SQS Orders Queue ARN

    Value: !GetAtt OrdersQueue.Arn