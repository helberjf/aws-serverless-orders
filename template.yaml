                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
  NotifyOrderFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FunctionAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt:
                    - NotificationsQueue
                    - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  Fn::GetAtt:
                    - NotificationReceiptsTable
                    - Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource:
                  - Fn::GetAtt:
                      - NotificationReceiptsTable
                      - Arn
                  - Fn::GetAtt:
                      - OutboxTable
                      - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - NotifyOrderLogGroup
                    - Arn
              - Sid: XRayWriteRequiresWildcard
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
  HealthFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FunctionAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - HealthLogGroup
                    - Arn
              - Sid: XRayWriteRequiresWildcard
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
  CanaryDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${ServerlessDeploymentApplication}/*
      Policies:
        - PolicyName: AliasTrafficShifting
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:UpdateAlias
                  - lambda:GetAlias
                  - lambda:GetProvisionedConcurrencyConfig
                Resource:
                  - Fn::Sub: ${CreateOrderFunction.Arn}:live
                  - Fn::Sub: ${GetOrderFunction.Arn}:live
                  - Fn::Sub: ${HealthFunction.Arn}:live
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*
Outputs:
  OrdersApi:
    Description: Cognito-authorized POST /orders endpoint
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/orders
  OrdersTableName:
    Description: DynamoDB Orders table
    Value:
      Ref: OrdersTable
  CreateOrderFunctionArn:
    Description: Create Order Lambda ARN
    Value:
      Fn::GetAtt:
        - CreateOrderFunction
        - Arn
  OrdersQueueUrl:
    Description: SQS Orders Queue URL
    Value:
      Ref: OrdersQueue
  OrdersQueueArn:
    Description: SQS Orders Queue ARN
    Value:
      Fn::GetAtt:
        - OrdersQueue
        - Arn
  OrdersDeadLetterQueueUrl:
    Description: Failed processing messages (safe to redrive after fixing the cause)
    Value:
      Ref: OrdersDeadLetterQueue
  OrdersDeadLetterQueueArn:
    Description: Failed processing queue ARN for redrive
    Value:
      Fn::GetAtt:
        - OrdersDeadLetterQueue
        - Arn
  PublishFailuresQueueUrl:
    Description: Stream failure metadata (not directly replayable order messages)
    Value:
      Ref: PublishFailuresQueue
  OutboxTable:
    Description: OutboxTable
    Value:
      Ref: OutboxTable
  IdempotencyTable:
    Description: IdempotencyTable
    Value:
      Ref: IdempotencyTable
  FulfillmentsTable:
    Description: FulfillmentsTable
    Value:
      Ref: FulfillmentsTable
  OrdersEventBus:
    Description: OrdersEventBus
    Value:
      Ref: OrdersEventBus
  NotificationsTopic:
    Description: NotificationsTopic
    Value:
      Ref: NotificationsTopic
  NotificationsQueueUrl:
    Description: NotificationsQueue
    Value:
      Ref: NotificationsQueue
  NotificationDeadLetterQueueUrl:
    Description: NotificationDeadLetterQueue
    Value:
      Ref: NotificationDeadLetterQueue
  EventDeliveryDeadLetterQueueUrl:
    Description: EventDeliveryDeadLetterQueue
    Value:
      Ref: EventDeliveryDeadLetterQueue
  NotificationAuditQueueUrl:
    Description: NotificationAuditQueue
    Value:
      Ref: NotificationAuditQueue
  NotificationDeliveryDeadLetterQueueUrl:
    Description: NotificationDeliveryDeadLetterQueue
    Value:
      Ref: NotificationDeliveryDeadLetterQueue
  ApiBaseUrl:
    Description: API base URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod
  CognitoUserPoolId:
    Description: Managed Cognito user pool
    Value:
      Ref: OrdersUserPool
  CognitoClientId:
    Description: Public OAuth client (no secret)
    Value:
      Ref: OrdersUserPoolClient
  CognitoDomain:
    Description: OAuth authorization and token base URL
    Value:
      Fn::Sub: https://${OrdersUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  OAuthCallbackUrl:
    Description: Configured callback URL
    Value:
      Ref: OAuthCallbackUrl
  DashboardUrl:
    Description: CloudWatch operations dashboard
    Value:
      Fn::Sub: https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-operations
  CreateOrderFunctionLiveAlias:
    Description: API traffic uses this versioned live alias
    Value:
      Ref: CreateOrderFunctionAliaslive
  CreateOrderFunctionDeploymentGroup:
    Description: CodeDeploy group for traffic shifting and rollback inspection
    Value:
      Ref: CreateOrderFunctionDeploymentGroup
  GetOrderFunctionLiveAlias:
    Description: API traffic uses this versioned live alias
    Value:
      Ref: GetOrderFunctionAliaslive
  GetOrderFunctionDeploymentGroup:
    Description: CodeDeploy group for traffic shifting and rollback inspection
    Value:
      Ref: GetOrderFunctionDeploymentGroup
  HealthFunctionLiveAlias:
    Description: API traffic uses this versioned live alias
    Value:
      Ref: HealthFunctionAliaslive
  HealthFunctionDeploymentGroup:
    Description: CodeDeploy group for traffic shifting and rollback inspection
    Value:
      Ref: HealthFunctionDeploymentGroup
  CodeDeployApplication:
    Description: CodeDeploy application
    Value:
      Ref: ServerlessDeploymentApplication
Parameters:
  TestNotificationEmail:
    Type: String
    Default: ''
    Description: Optional, explicitly approved test subscription. Leave empty to send no email.
  OAuthCallbackUrl:
    Type: String
    Default: http://localhost:8765/callback
    AllowedPattern: ^(https://[^ ]+|http://localhost:[0-9]+/callback)$
    Description: Explicit OAuth callback; localhost HTTP is for the local PKCE demo only.
  EnvironmentName:
    Type: String
    Default: development
    AllowedValues:
      - development
      - production
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional explicitly approved operational alert recipient; enables an encrypted SNS topic and a
      KMS key.
Conditions:
  HasTestEmail:
    Fn::Not:
      - Fn::Equals:
          - Ref: TestNotificationEmail
          - ''
  HasAlarmEmail:
    Fn::Not:
      - Fn::Equals:
          - Ref: AlarmEmail
          - ''
