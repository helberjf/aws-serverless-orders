AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Event-driven order processing with DynamoDB Streams, SQS and idempotent Lambda consumers.
Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME:
          Ref: AWS::StackName
        POWERTOOLS_LOG_LEVEL: INFO
        POWERTOOLS_TRACER_CAPTURE_RESPONSE: 'false'
        POWERTOOLS_TRACER_CAPTURE_ERROR: 'false'
        ENVIRONMENT:
          Ref: EnvironmentName
    Tags:
      Project:
        Ref: AWS::StackName
      Environment:
        Ref: EnvironmentName
  Api:
    TracingEnabled: true
    Auth:
      DefaultAuthorizer: OrdersCognitoAuth
      Authorizers:
        OrdersCognitoAuth:
          UserPoolArn:
            Fn::GetAtt:
              - OrdersUserPool
              - Arn
    MethodSettings:
      - ResourcePath: /*
        HttpMethod: '*'
        MetricsEnabled: false
        DataTraceEnabled: false
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
    GatewayResponses:
      UNAUTHORIZED:
        StatusCode: 401
        ResponseTemplates:
          application/json: '{"code":"UNAUTHORIZED","message":"Authentication is required","requestId":"$context.requestId"}'
      ACCESS_DENIED:
        StatusCode: 403
        ResponseTemplates:
          application/json: '{"code":"FORBIDDEN","message":"Access denied","requestId":"$context.requestId"}'
      DEFAULT_5XX:
        ResponseTemplates:
          application/json: '{"code":"INTERNAL_ERROR","message":"Internal server error","requestId":"$context.requestId"}'
    Name:
      Fn::Sub: ${AWS::StackName}-api
Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: KEYS_ONLY
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  OrdersDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  PublishFailuresQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 181
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - OrdersDeadLetterQueue
            - Arn
        maxReceiveCount: 5
  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/create-order/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: CreateOrderLogGroup
      Environment:
        Variables:
          ORDERS_TABLE:
            Ref: OrdersTable
          OUTBOX_TABLE:
            Ref: OutboxTable
          IDEMPOTENCY_TABLE:
            Ref: IdempotencyTable
          COGNITO_CLIENT_ID:
            Ref: OrdersUserPoolClient
          COGNITO_ISSUER:
            Fn::Sub: https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${OrdersUserPool}
      Events:
        CreateOrderApi:
          Type: Api
          Properties:
            Path: /orders
            Method: post
            Auth:
              Authorizer: OrdersCognitoAuth
              AuthorizationScopes:
                - orders/write
      Role:
        Fn::GetAtt:
          - CreateOrderFunctionRole
          - Arn
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DeploymentPreference:
        Type: Canary10Percent10Minutes
        Role:
          Fn::GetAtt:
            - CanaryDeploymentRole
            - Arn
        Alarms:
          - Ref: CreateOrderFunctionErrorsAlarm
          - Ref: CreateOrderFunctionThrottlesAlarm
          - Ref: ApiServerErrorsAlarm
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/create-order/app.ts
  GetOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/get-order/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: GetOrderLogGroup
      Environment:
        Variables:
          ORDERS_TABLE:
            Ref: OrdersTable
          COGNITO_CLIENT_ID:
            Ref: OrdersUserPoolClient
          COGNITO_ISSUER:
            Fn::Sub: https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${OrdersUserPool}
      Events:
        GetOrderApi:
          Type: Api
          Properties:
            Path: /orders/{orderId}
            Method: get
            Auth:
              Authorizer: OrdersCognitoAuth
              AuthorizationScopes:
                - orders/read
      Role:
        Fn::GetAtt:
          - GetOrderFunctionRole
          - Arn
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DeploymentPreference:
        Type: Canary10Percent10Minutes
        Role:
          Fn::GetAtt:
            - CanaryDeploymentRole
            - Arn
        Alarms:
          - Ref: GetOrderFunctionErrorsAlarm
          - Ref: GetOrderFunctionThrottlesAlarm
          - Ref: ApiServerErrorsAlarm
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/get-order/app.ts
  PublishOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/publish-order/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: PublishOrderLogGroup
      Timeout: 30
      Environment:
        Variables:
          ORDERS_QUEUE_URL:
            Ref: OrdersQueue
          OUTBOX_TABLE:
            Ref: OutboxTable
          ORDERS_EVENT_BUS:
            Ref: OrdersEventBus
          NOTIFICATIONS_TOPIC_ARN:
            Ref: NotificationsTopic
      Events:
        OrderInserted:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
                - OutboxTable
                - StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 5
            MaximumRetryAttempts: 10
            MaximumRecordAgeInSeconds: 3600
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"]}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination:
                  Fn::GetAtt:
                    - PublishFailuresQueue
                    - Arn
      Role:
        Fn::GetAtt:
          - PublishOrderFunctionRole
          - Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/publish-order/app.ts
    DependsOn:
      - OrdersProcessedRule
      - OrdersEventQueuePolicy
      - NotificationAuditSubscription
  ProcessOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/process-order/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: ProcessOrderLogGroup
      Timeout: 30
      Environment:
        Variables:
          ORDERS_TABLE:
            Ref: OrdersTable
          OUTBOX_TABLE:
            Ref: OutboxTable
          FULFILLMENTS_TABLE:
            Ref: FulfillmentsTable
      Events:
        Orders:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
                - OrdersQueue
                - Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
            MaximumBatchingWindowInSeconds: 1
      Role:
        Fn::GetAtt:
          - ProcessOrderFunctionRole
          - Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/process-order/app.ts
  CreateOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/create-order
      RetentionInDays: 14
  GetOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/get-order
      RetentionInDays: 14
  PublishOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/publish-order
      RetentionInDays: 14
  ProcessOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/process-order
      RetentionInDays: 14
  OrdersDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Orders exhausted processing retries. Follow docs/operations.md.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - OrdersDeadLetterQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmName:
        Fn::Sub: ${AWS::StackName}-OrdersDeadLetterAlarm
      AlarmActions:
        Fn::If:
          - HasAlarmEmail
          - - Ref: AlarmTopic
          - []
  PublishFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Stream retries exhausted. Inspect failure metadata and the durable outbox; see docs/operations.md.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - PublishFailuresQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmName:
        Fn::Sub: ${AWS::StackName}-PublishFailuresAlarm
      AlarmActions:
        Fn::If:
          - HasAlarmEmail
          - - Ref: AlarmTopic
          - []
  OrderBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Orders have been waiting more than five minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - OrdersQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmName:
        Fn::Sub: ${AWS::StackName}-OrderBacklogAlarm
      AlarmActions:
        Fn::If:
          - HasAlarmEmail
          - - Ref: AlarmTopic
          - []
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  FulfillmentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  OutboxTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: deliveryStatus
          AttributeType: S
        - AttributeName: nextAttemptAt
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: KEYS_ONLY
      GlobalSecondaryIndexes:
        - IndexName: PendingByNextAttempt
          KeySchema:
            - AttributeName: deliveryStatus
              KeyType: HASH
            - AttributeName: nextAttemptAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
  OrdersEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-orders
  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
  ReconcileOutboxFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/reconcile-outbox/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: ReconcileOutboxLogGroup
      Timeout: 90
      Environment:
        Variables:
          ORDERS_QUEUE_URL:
            Ref: OrdersQueue
          OUTBOX_TABLE:
            Ref: OutboxTable
          ORDERS_EVENT_BUS:
            Ref: OrdersEventBus
          NOTIFICATIONS_TOPIC_ARN:
            Ref: NotificationsTopic
      Events:
        ReconcileSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true
      Role:
        Fn::GetAtt:
          - ReconcileOutboxFunctionRole
          - Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/reconcile-outbox/app.ts
    DependsOn:
      - OrdersProcessedRule
      - OrdersEventQueuePolicy
      - NotificationAuditSubscription
  ReconcileOutboxLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/reconcile-outbox
      RetentionInDays: 14
  NotificationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  EventDeliveryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  NotificationDeliveryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  NotificationAuditQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 181
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - NotificationDeadLetterQueue
            - Arn
        maxReceiveCount: 5
  OrdersProcessedRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName:
        Ref: OrdersEventBus
      EventPattern:
        source:
          - com.helberjf.orders
        detail-type:
          - OrderProcessed
        detail:
          schemaVersion:
            - 1
      Targets:
        - Id: Notifications
          Arn:
            Fn::GetAtt:
              - NotificationsQueue
              - Arn
          DeadLetterConfig:
            Arn:
              Fn::GetAtt:
                - EventDeliveryDeadLetterQueue
                - Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 86400
            MaximumRetryAttempts: 185
  OrdersEventQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: NotificationsQueue
        - Ref: EventDeliveryDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - Fn::GetAtt:
                  - NotificationsQueue
                  - Arn
              - Fn::GetAtt:
                  - EventDeliveryDeadLetterQueue
                  - Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  Fn::GetAtt:
                    - OrdersProcessedRule
                    - Arn
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
          - Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource:
              - Fn::GetAtt:
                  - NotificationsQueue
                  - Arn
              - Fn::GetAtt:
                  - EventDeliveryDeadLetterQueue
                  - Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  NotificationAuditQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: NotificationAuditQueue
        - Ref: NotificationDeliveryDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - Fn::GetAtt:
                  - NotificationAuditQueue
                  - Arn
              - Fn::GetAtt:
                  - NotificationDeliveryDeadLetterQueue
                  - Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  Ref: NotificationsTopic
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
          - Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource:
              - Fn::GetAtt:
                  - NotificationAuditQueue
                  - Arn
              - Fn::GetAtt:
                  - NotificationDeliveryDeadLetterQueue
                  - Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  NotificationAuditSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: NotificationAuditQueuePolicy
    Properties:
      TopicArn:
        Ref: NotificationsTopic
      Protocol: sqs
      Endpoint:
        Fn::GetAtt:
          - NotificationAuditQueue
          - Arn
      RawMessageDelivery: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - NotificationDeliveryDeadLetterQueue
            - Arn
  NotificationReceiptsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
  TestEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasTestEmail
    Properties:
      TopicArn:
        Ref: NotificationsTopic
      Protocol: email
      Endpoint:
        Ref: TestNotificationEmail
  NotifyOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/notify-order/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: NotifyOrderLogGroup
      Timeout: 30
      Environment:
        Variables:
          OUTBOX_TABLE:
            Ref: OutboxTable
          NOTIFICATION_RECEIPTS_TABLE:
            Ref: NotificationReceiptsTable
      Events:
        Notifications:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
                - NotificationsQueue
                - Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
      Role:
        Fn::GetAtt:
          - NotifyOrderFunctionRole
          - Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/notify-order/app.ts
  NotifyOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/notify-order
      RetentionInDays: 14
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/health/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: HealthLogGroup
      Events:
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE
      Role:
        Fn::GetAtt:
          - HealthFunctionRole
          - Arn
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DeploymentPreference:
        Type: Canary10Percent10Minutes
        Role:
          Fn::GetAtt:
            - CanaryDeploymentRole
            - Arn
        Alarms:
          - Ref: HealthFunctionErrorsAlarm
          - Ref: HealthFunctionThrottlesAlarm
          - Ref: ApiServerErrorsAlarm
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/health/app.ts
  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/health
      RetentionInDays: 14
  OrdersUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName:
        Fn::Sub: ${AWS::StackName}-users
      UserPoolTier: LITE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 1
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      UserPoolTags:
        Project:
          Ref: AWS::StackName
  OrdersResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId:
        Ref: OrdersUserPool
      Identifier: orders
      Name: Orders API
      Scopes:
        - ScopeName: read
          ScopeDescription: Read own orders
        - ScopeName: write
          ScopeDescription: Create own orders
  OrdersUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: OrdersResourceServer
    Properties:
      UserPoolId:
        Ref: OrdersUserPool
      ClientName:
        Fn::Sub: ${AWS::StackName}-public-client
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - orders/read
        - orders/write
      CallbackURLs:
        - Ref: OAuthCallbackUrl
      LogoutURLs:
        - Ref: OAuthCallbackUrl
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  OrdersUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId:
        Ref: OrdersUserPool
      Domain:
        Fn::Sub:
          - orders-${AWS::AccountId}-${Suffix}
          - Suffix:
              Fn::Select:
                - 0
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
  QueueTlsPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: OrdersDeadLetterQueue
        - Ref: PublishFailuresQueue
        - Ref: OrdersQueue
        - Ref: NotificationDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource:
              - Fn::GetAtt:
                  - OrdersDeadLetterQueue
                  - Arn
              - Fn::GetAtt:
                  - PublishFailuresQueue
                  - Arn
              - Fn::GetAtt:
                  - OrdersQueue
                  - Arn
              - Fn::GetAtt:
                  - NotificationDeadLetterQueue
                  - Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  NotificationTopicTlsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - Ref: NotificationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: sns:Publish
            Resource:
              Ref: NotificationsTopic
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  AlarmEncryptionKey:
    Type: AWS::KMS::Key
    Condition: HasAlarmEmail
    Properties:
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: CloudWatchNotifications
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
