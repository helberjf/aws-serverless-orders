Parameters:
  TestNotificationEmail:
    Type: String
    Default: ''
    Description: Optional, explicitly approved test subscription. Leave empty to send no email.
  OAuthCallbackUrl:
    Type: String
    Default: http://localhost:8765/callback
    AllowedPattern: ^(https://[^ ]+|http://localhost:[0-9]+/callback)$
    Description: Explicit OAuth callback; localhost HTTP is for the local PKCE demo only.
Conditions:
  HasTestEmail:
    Fn::Not:
      - Fn::Equals:
          - Ref: TestNotificationEmail
          - ''
