AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Event-driven order processing with DynamoDB Streams, SQS and idempotent Lambda consumers.
Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
    Auth:
      DefaultAuthorizer: AWS_IAM
Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: KEYS_ONLY
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  OrdersDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  PublishFailuresQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 181
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - OrdersDeadLetterQueue
            - Arn
        maxReceiveCount: 5
  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/create-order/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: CreateOrderLogGroup
      Environment:
        Variables:
          ORDERS_TABLE:
            Ref: OrdersTable
          OUTBOX_TABLE:
            Ref: OutboxTable
          IDEMPOTENCY_TABLE:
            Ref: IdempotencyTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource:
                - Fn::GetAtt:
                    - OrdersTable
                    - Arn
                - Fn::GetAtt:
                    - IdempotencyTable
                    - Arn
                - Fn::GetAtt:
                    - OutboxTable
                    - Arn
      Events:
        CreateOrderApi:
          Type: Api
          Properties:
            Path: /orders
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/create-order/app.ts
  GetOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/get-order/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: GetOrderLogGroup
      Environment:
        Variables:
          ORDERS_TABLE:
            Ref: OrdersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource:
                Fn::GetAtt:
                  - OrdersTable
                  - Arn
      Events:
        GetOrderApi:
          Type: Api
          Properties:
            Path: /orders/{orderId}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/get-order/app.ts
  PublishOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/publish-order/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: PublishOrderLogGroup
      Timeout: 30
      Environment:
        Variables:
          ORDERS_QUEUE_URL:
            Ref: OrdersQueue
          OUTBOX_TABLE:
            Ref: OutboxTable
          ORDERS_EVENT_BUS:
            Ref: OrdersEventBus
          NOTIFICATIONS_TOPIC_ARN:
            Ref: NotificationsTopic
      Policies:
        - SQSSendMessagePolicy:
            QueueName:
              Fn::GetAtt:
                - OrdersQueue
                - QueueName
        - SQSSendMessagePolicy:
            QueueName:
              Fn::GetAtt:
                - PublishFailuresQueue
                - QueueName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - OutboxTable
                  - Arn
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource:
                Fn::GetAtt:
                  - OutboxTable
                  - StreamArn
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource:
                Fn::GetAtt:
                  - OrdersEventBus
                  - Arn
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource:
                Ref: NotificationsTopic
        - Statement:
            - Effect: Allow
              Action:
                - kms:GenerateDataKey
                - kms:Decrypt
              Resource:
                Fn::Sub: arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService:
                    Fn::Sub: sns.${AWS::Region}.${AWS::URLSuffix}
                ForAnyValue:StringEquals:
                  kms:ResourceAliases: alias/aws/sns
      Events:
        OrderInserted:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
                - OutboxTable
                - StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 5
            MaximumRetryAttempts: 10
            MaximumRecordAgeInSeconds: 3600
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"]}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination:
                  Fn::GetAtt:
                    - PublishFailuresQueue
                    - Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/publish-order/app.ts
    DependsOn:
      - OrdersProcessedRule
      - OrdersEventQueuePolicy
      - NotificationAuditSubscription
  ProcessOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/process-order/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: ProcessOrderLogGroup
      Timeout: 30
      Environment:
        Variables:
          ORDERS_TABLE:
            Ref: OrdersTable
          OUTBOX_TABLE:
            Ref: OutboxTable
          FULFILLMENTS_TABLE:
            Ref: FulfillmentsTable
      Policies:
        - SQSPollerPolicy:
            QueueName:
              Fn::GetAtt:
                - OrdersQueue
                - QueueName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - Fn::GetAtt:
                    - OrdersTable
                    - Arn
                - Fn::GetAtt:
                    - FulfillmentsTable
                    - Arn
                - Fn::GetAtt:
                    - OutboxTable
                    - Arn
      Events:
        Orders:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
                - OrdersQueue
                - Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
            MaximumBatchingWindowInSeconds: 1
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/process-order/app.ts
  CreateOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/create-order
      RetentionInDays: 14
  GetOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/get-order
      RetentionInDays: 14
  PublishOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/publish-order
      RetentionInDays: 14
  ProcessOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/process-order
      RetentionInDays: 14
  OrdersDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Orders exhausted processing retries. Follow docs/operations.md.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - OrdersDeadLetterQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  PublishFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Stream publishing failed. Inspect metadata and reconcile RECEIVED orders.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - PublishFailuresQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  OrderBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Orders have been waiting more than five minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - OrdersQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  FulfillmentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  OutboxTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: deliveryStatus
          AttributeType: S
        - AttributeName: nextAttemptAt
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: KEYS_ONLY
      GlobalSecondaryIndexes:
        - IndexName: PendingByNextAttempt
          KeySchema:
            - AttributeName: deliveryStatus
              KeyType: HASH
            - AttributeName: nextAttemptAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
  OrdersEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-orders
  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
  ReconcileOutboxFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/reconcile-outbox/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: ReconcileOutboxLogGroup
      Timeout: 90
      Environment:
        Variables:
          ORDERS_QUEUE_URL:
            Ref: OrdersQueue
          OUTBOX_TABLE:
            Ref: OutboxTable
          ORDERS_EVENT_BUS:
            Ref: OrdersEventBus
          NOTIFICATIONS_TOPIC_ARN:
            Ref: NotificationsTopic
      Policies:
        - SQSSendMessagePolicy:
            QueueName:
              Fn::GetAtt:
                - OrdersQueue
                - QueueName
        - SQSSendMessagePolicy:
            QueueName:
              Fn::GetAtt:
                - PublishFailuresQueue
                - QueueName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - OutboxTable
                  - Arn
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource:
                Fn::GetAtt:
                  - OrdersEventBus
                  - Arn
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource:
                Ref: NotificationsTopic
        - Statement:
            - Effect: Allow
              Action:
                - kms:GenerateDataKey
                - kms:Decrypt
              Resource:
                Fn::Sub: arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService:
                    Fn::Sub: sns.${AWS::Region}.${AWS::URLSuffix}
                ForAnyValue:StringEquals:
                  kms:ResourceAliases: alias/aws/sns
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                Fn::Sub: ${OutboxTable.Arn}/index/PendingByNextAttempt
      Events:
        ReconcileSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/reconcile-outbox/app.ts
    DependsOn:
      - OrdersProcessedRule
      - OrdersEventQueuePolicy
      - NotificationAuditSubscription
  ReconcileOutboxLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/reconcile-outbox
      RetentionInDays: 14
  NotificationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  EventDeliveryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  NotificationDeliveryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  NotificationAuditQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 181
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - NotificationDeadLetterQueue
            - Arn
        maxReceiveCount: 5
  OrdersProcessedRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName:
        Ref: OrdersEventBus
      EventPattern:
        source:
          - com.helberjf.orders
        detail-type:
          - OrderProcessed
        detail:
          schemaVersion:
            - 1
      Targets:
        - Id: Notifications
          Arn:
            Fn::GetAtt:
              - NotificationsQueue
              - Arn
          DeadLetterConfig:
            Arn:
              Fn::GetAtt:
                - EventDeliveryDeadLetterQueue
                - Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 86400
            MaximumRetryAttempts: 185
  OrdersEventQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: NotificationsQueue
        - Ref: EventDeliveryDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - Fn::GetAtt:
                  - NotificationsQueue
                  - Arn
              - Fn::GetAtt:
                  - EventDeliveryDeadLetterQueue
                  - Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  Fn::GetAtt:
                    - OrdersProcessedRule
                    - Arn
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
  NotificationAuditQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: NotificationAuditQueue
        - Ref: NotificationDeliveryDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - Fn::GetAtt:
                  - NotificationAuditQueue
                  - Arn
              - Fn::GetAtt:
                  - NotificationDeliveryDeadLetterQueue
                  - Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  Ref: NotificationsTopic
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
  NotificationAuditSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: NotificationAuditQueuePolicy
    Properties:
      TopicArn:
        Ref: NotificationsTopic
      Protocol: sqs
      Endpoint:
        Fn::GetAtt:
          - NotificationAuditQueue
          - Arn
      RawMessageDelivery: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - NotificationDeliveryDeadLetterQueue
            - Arn
  NotificationReceiptsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
  TestEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasTestEmail
    Properties:
      TopicArn:
        Ref: NotificationsTopic
      Protocol: email
      Endpoint:
        Ref: TestNotificationEmail
  NotifyOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/notify-order/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: NotifyOrderLogGroup
      Timeout: 30
      Environment:
        Variables:
          OUTBOX_TABLE:
            Ref: OutboxTable
          NOTIFICATION_RECEIPTS_TABLE:
            Ref: NotificationReceiptsTable
      Policies:
        - SQSPollerPolicy:
            QueueName:
              Fn::GetAtt:
                - NotificationsQueue
                - QueueName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - Fn::GetAtt:
                    - NotificationReceiptsTable
                    - Arn
                - Fn::GetAtt:
                    - OutboxTable
                    - Arn
      Events:
        Notifications:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
                - NotificationsQueue
                - Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/notify-order/app.ts
  NotifyOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/notify-order
      RetentionInDays: 14
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/health/app.lambdaHandler
      LoggingConfig:
        LogGroup:
          Ref: HealthLogGroup
      Events:
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/health/app.ts
  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}/health
      RetentionInDays: 14
Outputs:
  OrdersApi:
    Description: IAM-authorized API endpoint for POST orders and GET orders/{orderId}
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/orders
  OrdersTableName:
    Description: DynamoDB Orders table
    Value:
      Ref: OrdersTable
  CreateOrderFunctionArn:
    Description: Create Order Lambda ARN
    Value:
      Fn::GetAtt:
        - CreateOrderFunction
        - Arn
  OrdersQueueUrl:
    Description: SQS Orders Queue URL
    Value:
      Ref: OrdersQueue
  OrdersQueueArn:
    Description: SQS Orders Queue ARN
    Value:
      Fn::GetAtt:
        - OrdersQueue
        - Arn
  OrdersDeadLetterQueueUrl:
    Description: Failed processing messages (safe to redrive after fixing the cause)
    Value:
      Ref: OrdersDeadLetterQueue
  OrdersDeadLetterQueueArn:
    Description: Failed processing queue ARN for redrive
    Value:
      Fn::GetAtt:
        - OrdersDeadLetterQueue
        - Arn
  PublishFailuresQueueUrl:
    Description: Stream failure metadata (not directly replayable order messages)
    Value:
      Ref: PublishFailuresQueue
  ApiInvokeArn:
    Description: Resource ARN for callers with execute-api:Invoke permission
    Value:
      Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ServerlessRestApi}/Prod/*/orders*
  OutboxTable:
    Description: OutboxTable
    Value:
      Ref: OutboxTable
  IdempotencyTable:
    Description: IdempotencyTable
    Value:
      Ref: IdempotencyTable
  FulfillmentsTable:
    Description: FulfillmentsTable
    Value:
      Ref: FulfillmentsTable
  OrdersEventBus:
    Description: OrdersEventBus
    Value:
      Ref: OrdersEventBus
  NotificationsTopic:
    Description: NotificationsTopic
    Value:
      Ref: NotificationsTopic
  NotificationsQueueUrl:
    Description: NotificationsQueue
    Value:
      Ref: NotificationsQueue
  NotificationDeadLetterQueueUrl:
    Description: NotificationDeadLetterQueue
    Value:
      Ref: NotificationDeadLetterQueue
  EventDeliveryDeadLetterQueueUrl:
    Description: EventDeliveryDeadLetterQueue
    Value:
      Ref: EventDeliveryDeadLetterQueue
  NotificationAuditQueueUrl:
    Description: NotificationAuditQueue
    Value:
      Ref: NotificationAuditQueue
  NotificationDeliveryDeadLetterQueueUrl:
    Description: NotificationDeliveryDeadLetterQueue
    Value:
      Ref: NotificationDeliveryDeadLetterQueue
  ApiBaseUrl:
    Description: API base URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod
Parameters:
  TestNotificationEmail:
    Type: String
    Default: ''
    Description: Optional, explicitly approved test subscription. Leave empty to send no email.
Conditions:
  HasTestEmail:
    Fn::Not:
      - Fn::Equals:
          - Ref: TestNotificationEmail
          - ''
