name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_DEFAULT_REGION: sa-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      SAM_CLI_TELEMETRY: '0'
      COMPOSE_PROJECT_NAME: aws-orders-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: python scripts/check-secrets.py
      - run: python -m compileall -q scripts tests/infra tests/tooling
      - run: black --check scripts tests/infra tests/tooling
      - run: npm run test:infra
      - run: npm run test:tooling
      - run: cfn-lint infra/github-oidc.yaml
      - run: docker compose up -d
      - run: python scripts/wait-dynamodb.py
      - run: npm run test:integration
      - run: npm run validate
      - run: npm run build
      - run: node scripts/check-build.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          retention-days: 14
      - run: docker compose down
        if: always()
